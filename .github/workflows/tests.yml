name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # No API keys are set here. The tests drive the agent loop with a fake
      # model, and without LINER_API_KEY the search layer reads the fixtures in
      # tools/fixtures/, so the suite makes no network calls. One test runs a
      # small JavaScript harness with the node binary of the runner.
      - name: Test
        run: python -m pytest -q
