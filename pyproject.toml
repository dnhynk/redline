[project]
name = "redline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai-agents","httpx","fastapi","uvicorn[standard]","websockets",
                "trafilatura","pypdf","pyyaml","python-dotenv"]

[project.optional-dependencies]
dev = ["pytest","pytest-asyncio"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "tools"]
py-modules = ["main", "server"]
